name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            asset: splitlane-darwin-arm64
            target: bun-darwin-arm64
            file-pattern: arm64
            sign: true
          - runner: ubuntu-22.04
            asset: splitlane-linux-x64
            target: bun-linux-x64-baseline
            file-pattern: x86-64
            sign: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Validate release tag
        shell: bash
        run: |
          if ! grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$GITHUB_REF_NAME"; then
            echo "Release tags must use stable SemVer, for example v0.0.1" >&2
            exit 1
          fi
          # The updater takes the expected version from the tag and rejects a
          # downloaded binary whose own --version disagrees. A tag that does not
          # match package.json therefore publishes a release that every existing
          # installation refuses to install, which is invisible from the release
          # page itself. Fail before building instead.
          packaged=$(node -p 'require("./package.json").version')
          if [ "v$packaged" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $packaged" >&2
            echo "Bump package.json, commit it, and tag that commit." >&2
            exit 1
          fi
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Verify offline
        run: |
          bun run typecheck
          bun run test
      - name: Compile standalone executable
        run: |
          mkdir -p release
          bun build ./bin/splitlane.tsx --compile --target=${{ matrix.target }} --outfile=release/${{ matrix.asset }}
          chmod 0755 release/${{ matrix.asset }}
          file release/${{ matrix.asset }} | grep -q '${{ matrix.file-pattern }}'
      - name: Sign macOS executable
        if: matrix.sign
        run: |
          codesign --force --deep --sign - release/${{ matrix.asset }}
          codesign --verify --verbose=2 release/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: splitlane-*
          path: release
          merge-multiple: true
      - name: Create and verify checksums
        run: |
          cd release
          sha256sum splitlane-darwin-arm64 splitlane-linux-x64 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/splitlane-darwin-arm64 \
            release/splitlane-linux-x64 \
            release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Splitlane $GITHUB_REF_NAME"
